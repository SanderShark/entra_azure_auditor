[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entra-auditor"
dynamic = ["version", "dependencies"]
description = "Read-only security auditor for Microsoft Entra ID: inactive and privileged accounts, MFA, Conditional Access, stale apps."
readme = "README.md"
requires-python = ">=3.10"
# Add a `license` entry (and a LICENSE file) once you have chosen one.

[project.scripts]
auditor = "entra_auditor.cli:main"

[tool.setuptools.dynamic]
version = { attr = "entra_auditor.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["entra_auditor*"]

[tool.ruff]
line-length = 110
target-version = "py310"
# old/ is a local, untracked copy of an earlier tree (with its own venv); it is not part of the project.
extend-exclude = ["old"]

[tool.ruff.lint]
# ruff's default rules: syntax errors, undefined names, unused imports/variables, style pitfalls.
# Add "I" (import sorting), "B" (bugbear) or "UP" (modernising) once the code base is clean under them.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["entra_auditor"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
